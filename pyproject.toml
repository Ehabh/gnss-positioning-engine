[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "gnss-positioning-engine"
version = "1.0.0"
description = "Software-defined GNSS positioning engine — SPS/DGNSS/RTK from raw RTCM3 observations"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pyserial>=3.5",
    "PySide6>=6.5.0",
]

[project.optional-dependencies]
# Rich map tiles in the Map tab
webengine = ["PySide6-WebEngine>=6.5.0"]
# Fast SVG→PNG icon conversion at build time
icons = ["cairosvg>=2.7"]

[project.scripts]
gnss-engine = "gnss_positioning.ui.main_window:run_app"

[tool.setuptools.packages.find]
where = ["."]
include = ["gnss_positioning*"]

[tool.setuptools.package-data]
"gnss_positioning.ui" = ["assets/*.svg", "assets/*.png", "assets/*.icns"]
